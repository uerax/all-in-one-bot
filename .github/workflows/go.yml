name: Go Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-go-binary:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin] # 需要打包的系统
        goarch: [amd64, arm64] # 需要打包的架构
        exclude:
          # 排除无效组合
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Build
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        EXT: ${{ matrix.goos == 'windows' && '.exe' || '' }}
      run: |
        mkdir -p dist
        OUTPUT="dist/Aio-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}"
        go build -o "${OUTPUT}" -trimpath -ldflags "-s -w -buildid=" main.go
        echo "Built: ${OUTPUT}"

    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: Aio-${{ matrix.goos }}-${{ matrix.goarch }}
        path: dist/*
        retention-days: 1

  release:
    needs: build-go-binary
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-assets
        merge-multiple: true

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: release-assets/*

